name: study-mistakes
display_name: "错题本助手"
version: 0.2.4
description: "不用抄的错题本——拍一下,错题自己进去;到点了,复习自动找你。艾宾浩斯记忆曲线排期(1/2/4/7/15 天),答对进阶、答错回炉,学情错因看得见。坚持这件事,外包给系统。\n支持:拍照/截图、试卷 PDF(文字版)、Word、Excel;扫描版 PDF 请按页拍照。"
author: AgentPlatform Official
model: auto
guidance:
  - "📷 拍一道你最近做错的题,我来录入(不用抄,10 秒搞定)"
  - "今天有哪些到期错题?给我出复习卷"
  - "分析一下我的错因,哪类题最容易错"
  - "汇总一下我的学情"
  - "📄 整份试卷也能录吗?PDF/Word/Excel 怎么发?"
recommended_schedule:
  label: "每日错题回顾"
  prompt: "给我出今天到期的错题复习卷,并汇总我的学情变化"
  schedule_type: "daily"
  daily_at: "19:30"
depends_on: []
skills: []
tools:
  - id: tool:study_mistakes_book
    file: ./tools/book.py
