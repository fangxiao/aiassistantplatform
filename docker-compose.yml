# agentplatform 单机部署(见 docs/design/001-architecture.md §5)
# 四服务:pg / redis / api / web
services:
  pg:
    # pgvector 扩展镜像(M12 知识库,ADR 0004);与 postgres:15 同版本线
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: agentplatform
      POSTGRES_PASSWORD: agentplatform
      POSTGRES_DB: agentplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: agentplatform/Dockerfile
    env_file:
      - path: .deploy.env        # deploy.sh 生成;可放 LLM/搜索等全部可选配置
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://agentplatform:agentplatform@pg:5432/agentplatform
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      # LLM/搜索/动作等全部经 .deploy.env 透传(env_file);
      # 此处不再显式声明——空值会覆盖 env_file 的配置(诊断页抓到的坑)
    ports:
      - "8000:8000"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - search-net   # 直连 SearXNG(容器名解析;deploy --with-search 启动)

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # 前端在浏览器侧调用后端 API 的地址;局域网开发机需指向宿主机 LAN IP,
        # 默认 localhost 仅本机可用(见 web/lib/api/client.ts)。
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:

networks:
  search-net:
    name: agentplatform-net
    external: true
