# 联网搜索部署模板(M17 增补):SearXNG + Cloudflare WARP,完全免费、无请求额度、
# 不依赖宿主机任何代理软件——可部署到任意(含无外网直连)环境。
# 用法: docker compose -f deploy/docker-compose.search.yml up -d
# 平台侧配置: WEB_SEARCH_PROVIDER=searxng  SEARXNG_BASE_URL=http://localhost:8888
services:
  warp:
    image: caomingjun/warp
    container_name: warp
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
    environment:
      - GOST_PORT=1080
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    networks: [search-net]

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng   # settings.yml:json format + outgoing→socks5h://warp:1080
    networks: [search-net]
    depends_on: [warp]

networks:
  search-net:

volumes:
  warp-data:
